# ========================================================
# 1. CONFIGURAÇÃO DO BANCO DE DADOS (NEON.TECH / POSTGRESQL)
# ========================================================
datasources.default.url=${JDBC_URL:jdbc:postgresql://localhost:5432/rentcars}
datasources.default.username=${DB_USER:admin}
datasources.default.password=${DB_PASSWORD:adminpassword}
datasources.default.driverClassName=${DB_DRIVER:org.postgresql.Driver}

# ========================================================
# 2. CONFIGURAÇÃO DO JPA / HIBERNATE
# ========================================================
jpa.default.properties.hibernate.hbm2ddl.auto=update
jpa.default.properties.hibernate.show_sql=false
jpa.default.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
jpa.default.entity-scan.packages=com.aluguel.models

# ========================================================
# 3. MOTOR DE AUTENTICAÇÃO JWT
# ========================================================
micronaut.security.authentication=bearer
micronaut.security.reject-not-found=false
micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_SECRET:uma-chave-muito-longa-e-segura-para-o-rentcars-lab02-256bits}
micronaut.security.token.jwt.generator.access-token.expiration=${JWT_EXPIRATION:86400}

# ========================================================
# 4. CONFIGURAÇÃO DE CORS (COMUNICAÇÃO FRONTEND)
# ========================================================
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.default.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
micronaut.server.cors.configurations.default.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
micronaut.server.cors.configurations.default.allowed-headers=Content-Type,Authorization
micronaut.server.cors.configurations.default.exposed-headers=Authorization

# ========================================================
# 5. SEGURANÇA: LIBERAÇÃO DO PREFLIGHT (OPTIONS)
# ========================================================
micronaut.security.intercept-url-map[0].pattern=/**
micronaut.security.intercept-url-map[0].http-method=OPTIONS
micronaut.security.intercept-url-map[0].access=isAnonymous()

# ========================================================
# 6. FILA ASSÍNCRONA E RESILIÊNCIA (APEX MESSAGE BROKER)
# ========================================================
apex.queue.max-retries=3
apex.queue.dlq-name=apex.reservas.dlq

# ========================================================
# 7. OPENAPI & SWAGGER UI
# ========================================================
micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger-ui.paths=classpath:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**
