# ========================================================
# 1. CONFIGURAÇÃO DO BANCO DE DADOS (NEON.TECH)
# ========================================================
datasources.default.url=${JDBC_URL}
datasources.default.username=${DB_USER}
datasources.default.password=${DB_PASSWORD}
datasources.default.driverClassName=org.postgresql.Driver

# ========================================================
# 2. CONFIGURAÇÃO DO JPA / HIBERNATE
# ========================================================
# 'update' sincroniza as entidades do Lab02 com o banco automaticamente
jpa.default.properties.hibernate.hbm2ddl.auto=update
jpa.default.properties.hibernate.show_sql=true
jpa.default.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Escaneia as classes Cliente, Automovel e Pedido
jpa.default.entity-scan.packages=com.aluguel.models

# ========================================================
# 3. MOTOR DE AUTENTICAÇÃO JWT (O QUE FALTAVA)
# ========================================================
# Habilita a rota /login e a segurança via Bearer Token
micronaut.security.authentication=bearer
micronaut.security.reject-not-found=false
# Chave secreta para assinatura dos tokens (mantenha em sigilo em produção)
micronaut.security.token.jwt.signatures.secret.generator.secret=uma-chave-muito-longa-e-segura-para-o-rentcars-lab02-256bits

# ========================================================
# 4. CONFIGURAÇÃO DE CORS (COMUNICAÇÃO FRONTEND)
# ========================================================
micronaut.server.cors.enabled=true

# Origens permitidas (Vite/React)
micronaut.server.cors.configurations.default.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Métodos e Cabeçalhos permitidos
micronaut.server.cors.configurations.default.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
micronaut.server.cors.configurations.default.allowed-headers=Content-Type,Authorization
micronaut.server.cors.configurations.default.exposed-headers=Authorization

# ========================================================
# 5. SEGURANÇA: LIBERAÇÃO DO PREFLIGHT (OPTIONS)
# ========================================================
# Permite que o navegador faça o "ping" de segurança sem exigir token
micronaut.security.intercept-url-map[0].pattern=/**
micronaut.security.intercept-url-map[0].http-method=OPTIONS
micronaut.security.intercept-url-map[0].access=isAnonymous()

# ========================================================
# 6. LOGS E DEBUG
# ========================================================
logger.levels.io.micronaut.security=TRACE