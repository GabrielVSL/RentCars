# Configuração do banco em memória H2 para Testes Unitários e de Integração
datasources.default.url=jdbc:h2:mem:rentcars_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
datasources.default.username=sa
datasources.default.password=
datasources.default.driverClassName=org.h2.Driver
datasources.default.schema-generate=CREATE_DROP

jpa.default.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
jpa.default.properties.hibernate.hbm2ddl.auto=create-drop
